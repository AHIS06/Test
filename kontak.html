<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kontak - Harits</title>
</head>
<body>

    <!-- Navigasi Menu -->
    <table width="100%" bgcolor="#f4f4f4" cellpadding="10">
        <tr>
            <td align="right">
                <a href="about.html">ABOUT ME</a> | 
                <a href="profil.html">PROFIL</a> | 
                <a href="kontak.html">KONTAK</a>
            </td>
        </tr>
    </table>

    <br>

    <table width="75%" align="center" cellpadding="10">
        <tr>
            <td>
                <h2>Hubungi Saya</h2>
                <p>Silakan isi formulir di bawah ini untuk mengirimkan pesan atau penawaran kerja sama.</p>

                <form action="#" method="POST">
                    <table cellpadding="8">
                        <tr>
                            <td><label for="nama">Nama Lengkap</label></td>
                            <td>:</td>
                            <td><input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda"></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email</label></td>
                            <td>:</td>
                            <td><input type="email" id="email" name="email" required placeholder="email@contoh.com"></td>
                        </tr>
                        <tr>
                            <td><label for="subjek">Subjek</label></td>
                            <td>:</td>
                            <td><input type="text" id="subjek" name="subjek" required placeholder="Judul pesan"></td>
                        </tr>
                        <tr>
                            <td valign="top"><label for="pesan">Pesan</label></td>
                            <td valign="top">:</td>
                            <td>
                                <textarea id="pesan" name="pesan" rows="5" cols="40" required placeholder="Tulis pesan Anda di sini..."></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td></td>
                            <td>
                                <button type="submit">Kirim Pesan</button>
                                <button type="reset">Batal</button>
                            </td>
                        </tr>
                    </table>
                </form>

            </td>
        </tr>
    </table>

</body>
</html>
